<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parque Temático - Suporte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3rem;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            color: #a8b2d8;
        }

        .atracoes {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .atracao-card {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            width: 150px;
            backdrop-filter: blur(10px);
        }

        .atracao-card .icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .atracao-card p {
            font-size: 0.9rem;
            color: #a8b2d8;
        }

        footer {
            margin-top: 40px;
            color: #a8b2d8;
            font-size: 0.9rem;
        }

        df-messenger {
            --df-messenger-bot-message: #16213e;
            --df-messenger-button-titlebar-color: #e94560;
            --df-messenger-chat-background-color: #1a1a2e;
            --df-messenger-font-color: white;
            --df-messenger-send-icon: #e94560;
            --df-messenger-user-message: #0f3460;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎢 Parque Temático</h1>
        <p>Sistema de Suporte ao Visitante</p>
    </header>

    <div class="atracoes">
        <div class="atracao-card">
            <div class="icon">🎢</div>
            <p>Montanha-russa</p>
        </div>
        <div class="atracao-card">
            <div class="icon">🎠</div>
            <p>Carrossel</p>
        </div>
        <div class="atracao-card">
            <div class="icon">👻</div>
            <p>Trem Fantasma</p>
        </div>
        <div class="atracao-card">
            <div class="icon">🎡</div>
            <p>Roda Gigante</p>
        </div>
    </div>

    <footer>
        <p>© 2025 Parque Temático - Todos os direitos reservados</p>
    </footer>

    <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
    <df-messenger
        intent="WELCOME"
        chat-title="PARQUE_TEMÁTICO"
        agent-id="5ee3cbb2-ce05-44de-87a0-3db4c52a899c"
        language-code="pt-br"
    ></df-messenger>

</body>
</html>
